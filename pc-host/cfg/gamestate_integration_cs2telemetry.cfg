// CS2 Telemetry Dashboard - Valve Game State Integration config
//
// Install: run `python -m telemetry_host install-cfg` from the pc-host folder (fills in the token),
// or copy this file by hand to
//   <Steam library>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// and replace CHANGE_ME with gsi.token from pc-host\config.json.
// CS2 reads gamestate_integration_*.cfg files at startup: restart the game after any change.
"CS2 Telemetry Dashboard v1"
{
    "uri"       "http://127.0.0.1:3000/gsi"

    // Seconds the game waits for the host's HTTP 200 before abandoning a request.
    "timeout"   "5.0"
    // Seconds to collect state changes before sending (0 = send as soon as something changes).
    "buffer"    "0.0"
    // Minimum seconds between requests. 0.05 = at most ~20 updates/s; raise it to lighten the load.
    "throttle"  "0.05"
    // Resend the full state at least this often, even when nothing changed.
    "heartbeat" "10.0"

    "output"
    {
        "precision_time"     "3"
        "precision_position" "1"
        "precision_vector"   "3"
    }

    "auth"
    {
        "token" "CHANGE_ME"
    }

    "data"
    {
        // Sent while playing: describes you (or the teammate you spectate after dying).
        "provider"               "1"
        "map"                    "1"
        "map_round_wins"         "1"
        "round"                  "1"
        "player_id"              "1"
        "player_state"           "1"
        "player_weapons"         "1"
        "player_match_stats"     "1"
        "player_position"        "1"

        // The game fills these whenever the client sees the whole world: spectators, GOTV viewers,
        // casters, demos, and a local/listen server you host (offline-with-bots or a practice cfg).
        // A live Valve match sends only your own player above - never every player - by design.
        "allplayers_id"          "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
        "allplayers_weapons"     "1"
        "allplayers_position"    "1"
        "phase_countdowns"       "1"
        "allgrenades"            "1"
        "bomb"                   "1"
    }
}
