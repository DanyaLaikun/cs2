<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry Bridge Monitor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14; --panel: #131a22; --line: #2a3644; --text: #e6edf3; --muted: #8b98a5;
    --ct: #5da9e9; --t: #e8b04b; --bad: #f2545b; --good: #4cc38a; --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header strong { font-size: 14px; }
  .pill { padding: 2px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
  .pill.good { color: var(--good); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
  .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } }
  canvas { width: 100%; aspect-ratio: 1; background: #06090d; border: 1px solid var(--line); border-radius: 8px; display: block; }
  .score { display: flex; gap: 16px; align-items: baseline; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .ct { color: var(--ct); } .t { color: var(--t); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  tr.dead { opacity: .4; }
  .tablewrap { overflow-x: auto; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 40vh; overflow: auto; font-size: 11px; }
  summary { cursor: pointer; margin-top: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <strong>Telemetry bridge</strong>
  <span id="status" class="pill warn">connecting</span>
  <span id="meta" class="muted"></span>
</header>
<main>
  <section><canvas id="radar" width="1024" height="1024"></canvas></section>
  <section>
    <div class="score" id="score"><span class="muted">waiting for game data</span></div>
    <div id="mode" class="muted"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>HP</th><th>Armor</th><th>$</th><th>Weapon</th><th>K/A/D</th></tr></thead>
        <tbody id="players"></tbody>
      </table>
    </div>
    <details><summary>Raw state</summary><pre id="raw"></pre></details>
  </section>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws` +
    (params.has("token") ? `?token=${encodeURIComponent(params.get("token"))}` : "");
  const $ = (id) => document.getElementById(id);
  const canvas = $("radar"), ctx = canvas.getContext("2d");
  const colors = { CT: "#5da9e9", T: "#e8b04b" };
  let state = null, radar = { name: null, img: null }, received = 0, since = performance.now();

  function setStatus(text, cls) { $("status").textContent = text; $("status").className = `pill ${cls}`; }

  function connect() {
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => setStatus("linked", "good");
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.t === "state") { state = msg.d; received++; render(); }
      else if (msg.t === "hb") {
        const rate = received / ((performance.now() - since) / 1000);
        received = 0; since = performance.now();
        $("meta").textContent = msg.gsiAge == null ? "no game data yet"
          : `game data ${msg.gsiAge.toFixed(1)} s ago · ${rate.toFixed(1)} states/s · ${msg.clients} client(s)`;
      }
    };
    ws.onclose = () => { setStatus("offline, retrying", "bad"); setTimeout(connect, 1000); };
  }

  function loadRadar(info) {
    const name = info ? info.image : null;
    if (name === radar.name) return;
    radar = { name, img: null };
    if (!name) return;
    const img = new Image();
    img.onload = () => { if (radar.name === name) { radar.img = img; draw(); } };
    img.src = `/radar/${name}.png`;
  }

  function draw() {
    const S = canvas.width;
    ctx.fillStyle = "#06090d"; ctx.fillRect(0, 0, S, S);
    const info = state && state.map && state.map.radar;
    if (radar.img) ctx.drawImage(radar.img, 0, 0, S, S);
    else {
      ctx.strokeStyle = "#16202b"; ctx.lineWidth = 1;
      for (let i = 0; i <= S; i += S / 16) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, S); ctx.moveTo(0, i); ctx.lineTo(S, i); ctx.stroke(); }
    }
    if (!info) return;
    const k = S / 1024;
    const px = (x) => (x - info.posX) / info.scale * k, py = (y) => (info.posY - y) / info.scale * k;
    for (const g of state.grenades || []) {
      if (g.type === "inferno") for (const f of g.flames || []) { ctx.fillStyle = "rgba(255,122,47,.45)"; ctx.beginPath(); ctx.arc(px(f[0]), py(f[1]), 40 / info.scale * k, 0, 7); ctx.fill(); }
      else if (g.pos) {
        const r = g.type === "smoke" && g.effect > 0 ? 144 / info.scale * k : 5;
        ctx.fillStyle = g.type === "smoke" ? "rgba(184,194,204,.5)" : "#fff"; ctx.beginPath(); ctx.arc(px(g.pos[0]), py(g.pos[1]), r, 0, 7); ctx.fill();
      }
    }
    const b = state.bomb;
    if (b && b.pos && b.state !== "carried") { ctx.fillStyle = "#f2545b"; ctx.fillRect(px(b.pos[0]) - 8, py(b.pos[1]) - 8, 16, 16); }
    for (const p of state.players) {
      if (!p.pos) continue;
      const x = px(p.pos[0]), y = py(p.pos[1]), c = colors[p.team] || "#8b98a5";
      if (!(p.hp > 0)) { ctx.strokeStyle = c; ctx.globalAlpha = .5; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7); ctx.stroke(); ctx.globalAlpha = 1; continue; }
      if (p.yaw != null) { const a = -p.yaw * Math.PI / 180; ctx.fillStyle = c; ctx.globalAlpha = .25; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, 46, a - .7, a + .7); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill();
      if (p.id === state.focus) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 17, 0, 7); ctx.stroke(); }
      if (p.slot != null) { ctx.fillStyle = "#0b0f14"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.slot % 10, x, y + 1); }
    }
  }

  function render() {
    loadRadar(state.map && state.map.radar);
    draw();
    const m = state.map;
    $("score").innerHTML = m
      ? `<span class="ct">CT ${m.ct.score ?? 0}</span><span class="muted">${m.name} · round ${(m.round ?? 0) + 1} · ${(state.round && state.round.phase) || m.phase || ""}</span><span class="t">${m.t.score ?? 0} T</span>`
      : `<span class="muted">in menus</span>`;
    $("mode").textContent = state.mode === "player"
      ? "Player feed: Valve's GSI reports only your own player while you play."
      : state.mode === "spectator" ? "Spectator feed: all players, bomb and utility." : "";
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
    $("players").innerHTML = state.players.map((p) => {
      const w = (p.weapons || []).find((x) => x.state === "active");
      return `<tr class="${p.hp > 0 ? "" : "dead"}"><td>${p.slot ?? ""}</td><td class="${(p.team || "").toLowerCase()}">${esc(p.name)}</td>` +
        `<td>${p.hp ?? ""}</td><td>${p.armor ?? ""}${p.helmet ? "+H" : ""}</td><td>${p.money ?? ""}</td>` +
        `<td>${w ? esc(w.name) : ""}</td><td>${p.kills ?? 0}/${p.assists ?? 0}/${p.deaths ?? 0}</td></tr>`;
    }).join("");
    if ($("raw").parentElement.open) $("raw").textContent = JSON.stringify(state, null, 2);
  }

  connect();
})();
</script>
</body>
</html>
